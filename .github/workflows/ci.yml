name: CI

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'cmake/**'
      - 'cpp/**'
      - 'platforms/**'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      - 'vcpkg/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'cmake/**'
      - 'cpp/**'
      - 'platforms/**'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      - 'vcpkg/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    uses: ./.github/workflows/code-format-check.yml

  native-desktop:
    needs: format-check
    uses: ./.github/workflows/native-desktop.yml
    secrets: inherit
