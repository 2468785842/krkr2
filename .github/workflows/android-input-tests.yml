name: Android input contracts

on:
  push:
    branches: [main, dev]
    paths: ['cpp/core/input/**', 'platforms/android/app/java/org/tvp/kirikiri2/**', 'platforms/android/cpp/**', 'tests/android-input/**', '.github/workflows/android-input-tests.yml']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  input:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install matching NDK and CMake
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;28.0.13004108' 'cmake;3.31.1'
      - name: Compile the production Android Java sources
        run: bash platforms/android/gradlew -p platforms/android --no-daemon --console=plain :app:compileDebugJavaWithJavac
      - name: Build the isolated input APK and JNI tests before starting an emulator
        run: bash platforms/android/gradlew -p tests/android-input --no-daemon --console=plain assembleDebug assembleDebugAndroidTest
      - name: Enable KVM for the test emulator
        run: sudo chmod a+rw /dev/kvm
      - name: Verify real InputConnection and JNI on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash platforms/android/gradlew -p tests/android-input --no-daemon --console=plain connectedDebugAndroidTest
      - name: Require all device contracts to run
        run: |
          python - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          reports = list(pathlib.Path('tests/android-input/build/outputs/androidTest-results/connected').rglob('TEST-*.xml'))
          assert reports, 'No Android instrumentation reports'
          suites = [ET.parse(p).getroot() for p in reports]
          assert sum(int(s.attrib.get('tests', 0)) for s in suites) == 14, [s.attrib for s in suites]
          assert not any(int(s.attrib.get(k, 0)) for s in suites for k in ('failures', 'errors', 'skipped')), [s.attrib for s in suites]
          print('14 actual Android InputConnection/JNI contracts passed; this is an isolated test APK, not full game compatibility.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-input-contracts
          path: |
            tests/android-input/build/outputs/androidTest-results/
            tests/android-input/build/reports/androidTests/
            tests/android-input/build/outputs/apk/
          if-no-files-found: ignore
