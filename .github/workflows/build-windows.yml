name: Build Windows

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      pointer_contracts:
        description: 'Run GLView/TJS pointer probes with local Mesa software OpenGL (test binary)'
        type: boolean
        default: false

env:
  VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite"
  VCPKG_INSTALL_OPTIONS: "--debug"

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.act/vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Normalize and export VCPKG_ROOT
        run: |
          $normalized = "${{ github.workspace }}/.act/vcpkg" -replace '\\', '/'
          echo "VCPKG_ROOT=$normalized" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: |
          Invoke-WebRequest -Uri "https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip" -OutFile "$env:TEMP\winflexbison.zip"
          Expand-Archive -Path "$env:TEMP\winflexbison.zip" -DestinationPath "C:\winflexbison"
          echo "C:\winflexbison" | Out-File -Append -Encoding ascii $env:GITHUB_PATH
          
          choco install python3 -y

      - name: Setup vcpkg
        run: |
          echo "VCPKG_ROOT is: $env:VCPKG_ROOT"
          
          if (!(Test-Path "${{ env.VCPKG_ROOT }}")) {
            git clone https://github.com/microsoft/vcpkg.git ${{ env.VCPKG_ROOT }}
          }
          ${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.bat

          if (Test-Path "${{ env.VCPKG_ROOT }}/vcpkg.exe") {
            ${{ env.VCPKG_ROOT }}/vcpkg integrate install
          }

      - name: Add NuGet sources
        shell: pwsh
        run: |
          .$(${{ env.VCPKG_ROOT }}/vcpkg fetch nuget) `
            sources add `
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "${{ github.actor }}" `
            -Password "${{ secrets.NUGET_API_KEY }}"
          .$(${{ env.VCPKG_ROOT }}/vcpkg fetch nuget) `
            setapikey "${{ secrets.NUGET_API_KEY }}" `
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.18
        with:
          key: ${{ github.job }}-${{ runner.os }}

      - name: Configure Windows
        shell: pwsh
        run: |
          $driver = if ('${{ inputs.pointer_contracts }}' -eq 'true') { 'ON' } else { 'OFF' }
          cmake --preset="Windows Release Config" -DENABLE_TESTS=ON -DBUILD_TOOLS=OFF "-DKRKR2_ENABLE_UI_TEST_DRIVER=$driver"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows
        run: cmake --build --preset="Windows Release Build" --target krkr2 cocos_window_tests

      - name: Verify Cocos window, pointer and focus contracts
        shell: bash
        run: |
          ctest --test-dir out/windows/release -N -R '^cocos (window|pointer|focus)'
          python - <<'PY'
          import json, subprocess
          tests = json.loads(subprocess.check_output([
              'ctest', '--test-dir', 'out/windows/release', '--show-only=json-v1',
              '-R', '^cocos (window|pointer|focus)']))['tests']
          assert len(tests) == 9, tests
          print('Registered 2 Cocos node-order, 3 pointer-coordinate and 4 focus contracts.')
          PY
          ctest --test-dir out/windows/release -R '^cocos (window|pointer|focus)' --output-on-failure --no-tests=error

      - name: Verify renderer compilation scope
        shell: bash
        run: |
          python - <<'PYTHON'
          import json, pathlib
          root = pathlib.Path('out/windows/release')
          commands = json.loads((root / 'compile_commands.json').read_text(encoding='utf-8'))
          files = [c['file'].replace('\\', '/') for c in commands]
          for source in ('visual/RenderManager.cpp', 'visual/ogl/RenderManager_ogl.cpp',
                         'imageops/ImageOps.cpp', 'imageops/ImageOps_opencv.cpp'):
              matches = [p for p in files if p.endswith('/cpp/core/' + source)]
              assert len(matches) == 1, (source, matches)
          print('Full application includes both renderers and both ImageOps sources exactly once.')
          PYTHON

      - name: Run real Window pointer and native focus contracts with software OpenGL
        if: inputs.pointer_contracts
        shell: pwsh
        timeout-minutes: 10
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          $probe = 'out/windows/pointer-contracts'
          New-Item -ItemType Directory -Force $probe | Out-Null
          $archive = "$probe/mesa.7z"
          # 26.2.6 MSVC lacks OpenGL because of an upstream d3d12 build
          # regression; the release notes recommend the MinGW x64 package.
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.6/mesa3d-26.2.6-release-mingw.7z' -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'da0f71d9181b672c1918f3c342f11118c687f6059a46b16502845160733cc388') { throw 'Mesa archive SHA256 mismatch' }
          7z x $archive "-o$probe/mesa" -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Keep Mesa local to an isolated runtime; never modify system OpenGL
          # or add these libraries to the normal binary artifact.
          Copy-Item 'out/windows/release/bin/krkr2' "$probe/runtime" -Recurse
          Copy-Item "$probe/mesa/x64/*.dll" "$probe/runtime"
          Get-FileHash "$probe/runtime/opengl32.dll", "$probe/runtime/libgallium_wgl.dll" -Algorithm SHA256 |
            Format-List | Out-File "$probe/mesa-identity.txt"
          python -m unittest discover -s tools/game-smoke -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/game-smoke/pointer_repro.py "$probe/runtime/krkr2.exe" "$probe/single-window"
          $single = $LASTEXITCODE
          python tools/game-smoke/pointer_windows_repro.py "$probe/runtime/krkr2.exe" "$probe/two-windows"
          $multiple = $LASTEXITCODE
          python tools/game-smoke/focus_repro.py "$probe/runtime/krkr2.exe" "$probe/native-focus"
          $focus = $LASTEXITCODE
          if ($single -ne 0 -or $multiple -ne 0 -or $focus -ne 0) { exit 1 }

      - name: Upload pointer contract evidence
        if: always() && inputs.pointer_contracts
        uses: actions/upload-artifact@v4
        with:
          name: windows-pointer-contracts
          path: |
            out/windows/pointer-contracts/mesa-identity.txt
            out/windows/pointer-contracts/single-window/**
            out/windows/pointer-contracts/two-windows/**
            out/windows/pointer-contracts/native-focus/**
          if-no-files-found: warn

      - name: Upload small pointer reports and screenshots
        if: always() && inputs.pointer_contracts
        uses: actions/upload-artifact@v4
        with:
          name: windows-pointer-contract-reports
          path: |
            out/windows/pointer-contracts/mesa-identity.txt
            out/windows/pointer-contracts/single-window/**
            out/windows/pointer-contracts/two-windows/**
            out/windows/pointer-contracts/native-focus/**
            !out/windows/pointer-contracts/*/evidence/**
          if-no-files-found: warn

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-metadata
          path: |
            out/windows/release/compile_commands.json
            out/windows/release/vcpkg_installed/vcpkg/status
          if-no-files-found: ignore

      - name: Upload artifacts
        if: ${{ !env.ACT && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.pointer_contracts && 'windows-pointer-test-binaries' || 'windows-binaries' }}
          path: |
            out/windows/release/bin/krkr2/**
